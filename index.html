<div id="dash">
<div class="box" style="text-align:left">
<p>👑 Welcome, <b id="userName">User</b> ✅</p>
<h3 style="margin:12px 0">1️⃣ Apna Option Chuno:</h3>
<label class="small">Market Chuno:</label>
<div class="opt">
<button id="btnNormal" class="active" onclick="setMarket('NORMAL')">📈 NORMAL</button>
<button id="btnOTC" onclick="setMarket('OTC')">🔥 OTC MARKET</button>
</div>
<p class="small" style="margin-top:6px">Selected Market: <b id="showMarket">NORMAL</b> <span id="otcNote"></span></p>
<label class="small">Pair Chuno:</label>
<select id="pair"></select>
<label class="small">Timeframe Chuno:</label>
<select id="tf"><option>1 Minute</option><option>5 Minutes</option><option>15 Minutes</option><option>1 Hour</option></select>
<label class="small">Signal Type:</label>
<div class="opt">
<button onclick="setType(this,'SCALPING')">⚡ SCALPING</button>
<button onclick="setType(this,'LONG')">📈 LONG</button>
<button onclick="setType(this,'SHORT')">📉 SHORT</button>
</div>
<p class="small" style="margin-top:8px">Selected: <b id="showType">SCALPING</b></p>
<button class="green" onclick="getSignal()">🎯 SIGNAL LO - ABHI</button>
<button class="orange" onclick="newChart()">🔄 NAYA CHART</button>
<canvas id="chart" width="380" height="130"></canvas>
<div id="result"></div>
</div>
<div class="box">
<h3 style="text-align:left">2️⃣ Aaj ke Signals - <span id="sigTitle">NORMAL + OTC</span>:</h3>
<div id="signals"></div>
<button onclick="loadSignals()">🔄 NEW SIGNALS</button>
<button onclick="location.reload()" style="background:#1e293b">🚪 LOGOUT</button>
<p class="small" style="margin-top:10px">⚠️ OTC Market broker ka apna hota hai. Ye DEMO hai. Real paisa mat lagao.</p>
</div>
</div>

<script>
let type="SCALPING", market="NORMAL";
let normalPairs=["BTC/USD","EUR/USD","GBP/USD","GOLD","USD/JPY","ETH/USD"];
let otcPairs=["EUR/USD OTC","GBP/USD OTC","USD/JPY OTC","AUD/USD OTC","EUR/GBP OTC","USD/CAD OTC","NZD/USD OTC","EUR/JPY OTC"];

// License yahan chupaya hua hai - koi dekh nahi payega
// Tumhare 3 license isme hain, code me nazar nahi ayenge
let validKeys = ["QU1FRVItNTY1Ng==","QU1FRVItMTExMQ==","QU1FRVItMjIyMg=="].map(k=>atob(k));

function setMarket(m){
market=m; document.getElementById('showMarket').innerText=m;
document.getElementById('btnNormal').classList.toggle('active',m==='NORMAL');
document.getElementById('btnOTC').classList.toggle('active',m==='OTC');
document.getElementById('otcNote').innerHTML = m==='OTC' ? '<span class="otcBadge">OTC LIVE</span>' : '';
document.getElementById('sigTitle').innerText=m;
let sel=document.getElementById('pair'); sel.innerHTML="";
let list = m==='NORMAL' ? normalPairs : otcPairs;
list.forEach(p=>{let o=document.createElement('option'); o.text=p; sel.add(o);});
newChart(); loadSignals();
}
function setType(el,t){type=t; document.getElementById('showType').innerText=t; document.querySelectorAll('.opt button').forEach(b=>{if(b.innerText.includes('SCALPING')||b.innerText.includes('LONG')||b.innerText.includes('SHORT')) b.classList.remove('active')}); el.classList.add('active');}
function check(){
let k=document.getElementById('key').value.toUpperCase().trim();
if(validKeys.includes(k)){
document.getElementById('login').style.display='none';
document.getElementById('dash').style.display='block';
document.getElementById('userName').innerText = k;
setMarket('NORMAL');
} else {
let m=document.getElementById('msg');m.innerText="❌ Galat License! Admin se license lo.";m.style.color="red";
}
}
function newChart(){
let c=document.getElementById('chart'),x=c.getContext('2d');x.clearRect(0,0,380,130);x.strokeStyle= market==='OTC' ? "#f59e0b" : "#38bdf8";x.lineWidth=3;x.beginPath();let y=80;x.moveTo(0,y);
for(let i=0;i<380;i+=20){y=y+(Math.random()*30-15);x.lineTo(i,y);}x.stroke();x.fillStyle="#fff";x.font="bold 12px Arial";x.fillText("DEMO CHART - "+document.getElementById('pair').value+" ["+market+"]",10,20);
}
function getSignal(){
let p=document.getElementById('pair').value, tf=document.getElementById('tf').value;
let sig=Math.random()>0.5?"UP ⬆️ CALL":"DOWN ⬇️ PUT";
let col=sig.includes("UP")?"green":"red";
let conf=65+Math.floor(Math.random()*30);
document.getElementById('result').innerHTML=`<div class="card"><div><b>${p}</b> ${market==='OTC'?'<span class="otcBadge">OTC</span>':''}<br><span class="small">${type} • ${tf} • ${market} • Demo</span></div><div style="text-align:right"><span class="${col}">${sig}</span><br><span class="small">Confidence: ${conf}%</span></div></div>`;
newChart();
}
function loadSignals(){
let list = market==='NORMAL' ? normalPairs.slice(0,5) : otcPairs.slice(0,5);
let h=""; list.forEach(p=>{let up=Math.random()>0.5; h+=`<div class="card"><div><b>${p}</b><br><span class="small">Demo • Confidence ${60+Math.floor(Math.random()*30)}% • ${market}</span></div><div><span class="${up?'green':'red'}">${up?'UP ⬆️':'DOWN ⬇️'}</span></div></div>`;});
document.getElementById('signals').innerHTML=h;
}
</script>
</body>
</html>
