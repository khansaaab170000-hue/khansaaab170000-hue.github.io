<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ameer Khan AI BOT PRO</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:15px;margin:0;text-align:center}
.box{background:#0a1a3a;padding:18px;border-radius:20px;border:2px solid #00c6ff}
.btn{border:none;padding:13px 18px;border-radius:30px;color:#fff;font-weight:bold;font-size:15px;margin:5px}
.blue{background:#00aaff}
.green{background:#22c55e;width:100%;padding:15px;font-size:18px;margin-top:12px;border:none;border-radius:30px;color:#fff;font-weight:bold}
.orange{background:#f59e0b;width:100%;padding:15px;font-size:18px;margin-top:10px;border:none;border-radius:30px;color:#fff;font-weight:bold}
select{width:100%;padding:14px;border-radius:30px;background:#000;color:#fff;border:2px solid #00c6ff;font-size:18px;text-align:center;margin:8px 0}
.signal{font-size:32px;font-weight:bold;margin:15px}
.timer{font-size:32px;color:#facc15;font-weight:bold;background:#000;padding:10px;border-radius:15px;border:2px solid #facc15}
.chart{background:#020617;border-radius:15px;padding:10px;margin-top:12px;height:120px}
canvas{width:100%;height:80px}
</style>
</head>
<body>
<div class="box">
<h2>👑 Welcome, AMEER KHAN ✅</h2>

<p>Market Chuno:</p>
<button class="btn blue" onclick="setMarket('NORMAL')">📈 NORMAL</button>
<button class="btn blue" onclick="setMarket('OTC')">🔥 OTC MARKET</button>
<p>Selected Market: <b id="mkt" style="color:#facc15">NORMAL</b></p>

<p>Pair Chuno:</p>
<select id="pair"><option>BTC/USD</option><option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option></select>

<p>Timeframe Chuno:</p>
<select id="tf"><option>1 Minute</option><option>2 Minute</option><option>5 Minute</option></select>

<p>Signal Type:</p>
<button class="btn blue" onclick="setType('SCALPING')">⚡ SCALPING</button>
<button class="btn blue" onclick="setType('LONG')">📈 LONG</button>
<button class="btn blue" onclick="setType('SHORT')">📉 SHORT</button>
<p>Selected: <b id="stype">SCALPING</b></p>

<button class="green" onclick="getSignal()">🎯 SIGNAL LO - ABHI</button>
<button class="orange" onclick="newChart()">🔄 NAYA CHART</button>

<div class="signal" id="sig">READY...</div>

<!-- YAHAN SECOND LAGA DIYA - NORMAL + OTC DONO KE LIYE -->
<div class="timer" id="timer">⏱️ 00 : 60 Second</div>
<p id="marketTimer" style="color:#00c6ff">NORMAL MARKET - Timer Ready Hai</p>
<p id="liveTime" style="color:#aaa">Time: --:--:--</p>

<div class="chart">
<p style="margin:0;font-size:13px">LIVE CHART - <span id="chartPair">BTC/USD</span> [<span id="chartMkt">NORMAL</span>]</p>
<canvas id="c"></canvas>
</div>

</div>

<script>
let type="SCALPING", market="NORMAL";
let sec=60, interval;

function setMarket(m){
  market=m;
  document.getElementById("mkt").innerHTML=m;
  document.getElementById("chartMkt").innerHTML=m;
  document.getElementById("marketTimer").innerHTML=m+" MARKET - Timer Ready Hai";
  // Market badalte hi second phir se 60 kar do
  clearInterval(interval);
  sec=60;
  document.getElementById("timer").innerHTML="⏱️ 00 : 60 Second";
}

function setType(t){ type=t; document.getElementById("stype").innerHTML=t; }

function getSignal(){
  let s = ["🟢 LONG - UP LAGAO","🔴 SHORT - DOWN LAGAO"];
  let r = Math.floor(Math.random()*2);
  document.getElementById("sig").innerHTML = s[r] + " | " + type + " | " + market;

  // SECOND WALA TIMER - NORMAL + OTC DONO MEIN CHALEGA
  clearInterval(interval);
  sec=60;
  interval=setInterval(()=>{
    sec--;
    document.getElementById("timer").innerHTML = "⏱️ 00 : " + (sec<10?"0"+sec:sec) + " Second";
    document.getElementById("marketTimer").innerHTML = market + " MARKET - " + sec + " Second Baaki Hai";
    if(sec<=0){
      clearInterval(interval);
      document.getElementById("timer").innerHTML="⏱️ TIME KHATAM - NAYA SIGNAL LO";
    }
  },1000);
}

function newChart(){
  draw();
  document.getElementById("chartPair").innerHTML=document.getElementById("pair").value;
}

function draw(){
  let cv=document.getElementById("c"), ctx=cv.getContext("2d");
  cv.width=300; cv.height=80;
  ctx.clearRect(0,0,300,80);
  ctx.strokeStyle="#00c6ff"; ctx.lineWidth=2; ctx.beginPath();
  let y=40; ctx.moveTo(0,y);
  for(let x=0;x<=300;x+=15){ y=40+Math.random()*30-15; ctx.lineTo(x,y); }
  ctx.stroke();
}
draw();

setInterval(()=>{
  let d=new Date();
  document.getElementById("liveTime").innerHTML="Time: "+d.getHours()+":"+d.getMinutes()+":"+d.getSeconds();
},1000);
</script>
</body>
</html>
